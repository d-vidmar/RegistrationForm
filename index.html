<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8">
		<title>Stripe Login</title>
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>
		<div class="zunanji">
			<div class="okno">
				<h1>Sign in to your account</h1>
				<form action="" method="GET">
					<label for="email">Email</label>
					<input type="email" name="email" id="email" required></input>
					<div id="passwordText">
						<label for="password">Password</label>
						<a href="#" id="forgotPassword">Forgot your password?</a>
					</div>
					<input type="password" name="password" id="password" required></input><br>
					<input type="checkbox" name="remember" id="remember">
						<label for="remember" id="rememberLabel">Remember me on this device</label>
					</input><br>
					<input type="submit" value="Sign in" id="signin"></input>
					<div id="signinWithText">
						<div></div>
						<p>Or sign in with</p>
					</div>
					<a href="#" class="otherSignin"><img src="images/google-logo.svg"> Google</a>
					<a href="#" class="otherSignin">
						<svg class="otherSignInIcon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M8 8a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.75 1a2.25 2.25 0 0 0-.75 4.372v3.378a.75.75 0 0 0 1.5 0V15h.75a.75.75 0 0 0 0-1.5h-.75v-1.628a2.251 2.251 0 0 0-.75-4.372ZM13 9.75a.75.75 0 1 1 1.5 0 .75.75 0 0 1-1.5 0Z"></path><path d="M.5 14a5 5 0 0 1 5-5h3.75a.75.75 0 0 1 0 1.5H5.5A3.5 3.5 0 0 0 2 14a.5.5 0 0 0 .5.5h8.25a.75.75 0 0 1 0 1.5H2.5a2 2 0 0 1-2-2Z"></path></svg> Passkey</a>
					<a href="#" class="otherSignin">
						<svg class="otherSignInIcon" aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path d="M11.358 6.19a.75.75 0 0 0-1.216-.88L7.436 9.059l-1.629-1.81a.75.75 0 0 0-1.114 1.004l2.25 2.5a.75.75 0 0 0 1.165-.063l3.25-4.5Z"></path><path fill-rule="evenodd" clip-rule="evenodd" d="m4.828 14.219 2.256 1.504a1.652 1.652 0 0 0 1.832 0l2.256-1.504a8 8 0 0 0 3.55-6.213l.249-4.478c.016-.287-.212-.53-.494-.582C12.747 2.622 9.968.936 8.919.27A1.717 1.717 0 0 0 8 0c-.326 0-.644.096-.92.271-1.048.666-3.826 2.35-5.557 2.675-.282.053-.51.295-.494.582l.25 4.478a8 8 0 0 0 3.55 6.213ZM2.776 7.923 2.57 4.226c.905-.28 1.867-.734 2.683-1.16a37.88 37.88 0 0 0 2.631-1.528A.22.22 0 0 1 8 1.5c.03 0 .07.009.116.038.542.344 1.538.956 2.631 1.528.816.426 1.778.88 2.683 1.16l-.206 3.697a6.5 6.5 0 0 1-2.884 5.048l-2.256 1.504a.151.151 0 0 1-.168 0L5.66 12.97a6.5 6.5 0 0 1-2.884-5.048Z"></path></svg> SSO</a>
					
				</form>
				<div id="createAccount">
					New to stripe? <a href="#">Create account</a>
				</div>
			</div>
		</div>
	
	</body>
</html>
